<!doctype html>
<html lang="en">
<head>

<title>OffCode join screen (animated preview)</title>
<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #15171C;
  background-color: #F5F2EB;
}
.stage {
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr;
  background-color: #F5F2EB;
  background-image: linear-gradient(#E4DFD3 1px, transparent 1px), linear-gradient(90deg, #E4DFD3 1px, transparent 1px);
  background-size: 40px 40px;
}
.float {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  pointer-events: none;
  overflow: hidden;
}
.lg {
  position: absolute;
  left: 0;
  top: 0;
  opacity: .3;
  will-change: transform;
}
.lg svg {
  display: block;
  width: 100%;
  height: 100%;
}
.pane {
  grid-column: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px;
  position: relative;
}
.tab {
  flex: 1;
  height: 40px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #5E6470;
  cursor: pointer;
}
.tab.on {
  background: #FFFEFB;
  color: #15171C;
  box-shadow: 0 1px 3px rgba(20,25,40,.08);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  background: #EFECE3;
  font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #5E6470;
}
.lbl {
  font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #5E6470;
  margin: 0 0 8px;
}
.inp {
  box-sizing: border-box;
  width: 100%;
  height: 44px;
  padding: 0 14px;
  border: 1px solid #E4DFD3;
  border-radius: 8px;
  background: #F5F2EB;
  font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #15171C;
}
@media (max-width:900px){
  .stage { grid-template-columns: 1fr; }
  .float { right: 0; }
  .pane { grid-column: 1; padding: 24px; }
}
</style>
</head>
<body>

<div class="float" aria-hidden="true">
<div class="lg" style="left:2%;top:8%;width:105px;height:105px;animation-duration:16s;animation-delay:-3s"><svg viewBox="0 0 48 48"><path d="M24 4c-9 0-8 4-8 4v5h8v2H12S4 14 4 24s6 10 6 10h4v-5s0-6 6-6h9s5 0 5-5V9s1-5-10-5z" fill="#3776ab"/><path d="M24 44c9 0 8-4 8-4v-5h-8v-2h12s8 1 8-9-6-10-6-10h-4v5s0 6-6 6h-9s-5 0-5 5v10s-1 4 10 4z" fill="#ffd43b"/><circle cx="18" cy="9" r="1.6" fill="#fff"/><circle cx="30" cy="39" r="1.6" fill="#fff"/></svg></div>

<div class="pane">
<div style="box-sizing:border-box;width:100%;max-width:470px;padding:36px 30px 28px;background:#FFFEFB;border:1px solid #E4DFD3;border-radius:10px;box-shadow:0 4px 16px rgba(21,23,28,0.08);display:flex;flex-direction:column;gap:18px">
<div style="text-align:center;font-size:36px;font-weight:800;letter-spacing:-1px;color:#15171C;padding-top:10px"><span style="color:#2563EB">{</span><span style="font-weight:400;color:#15171C">Off</span>Code|<span style="color:#EA580C">}</span></div>
<div style="text-align:center;font-size:15px;color:#5E6470">Collaborative code editor that works offline.</div>
<div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
<span class="chip">Live cursors</span>
<span class="chip">Works offline</span>
<span class="chip">Review mode</span>
</div>
<div style="display:flex;gap:4px;padding:4px;background:#EFECE3;border:1px solid #E4DFD3;border-radius:8px">
<button type="button" class="tab">Create Room</button>
<button type="button" class="tab on">Join Room</button>
</div>
<div>
<label class="lbl" for="nm" style="display:block">Your Name</label>
<input id="nm" class="inp" type="text" value="Shoaib">
</div>
<div>
<label class="lbl" for="rm" style="display:block">Room Code</label>
<input id="rm" class="inp" type="text" value="hackathon-room">
</div>
<button type="button" style="height:44px;border:0;border-radius:6px;background:#2563EB;color:#fff;font:600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;cursor:pointer">Join Room</button>
<div style="display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid #E4DFD3;font-size:13px;color:#5E6470"><span>Synced through your room server. Keeps working offline.</span></div>
</div>
</div>
</div>
<script>
(function(){
var box=document.querySelector('.float');
if(!box)return;
var els=[].slice.call(box.querySelectorAll('.lg'));
var W=0,H=0,k=1,L=[],PEAK=0.15,CHASE_P=0.15,CL=0,CR=0,card=document.querySelector('.pane>div');
function rnd(a,b){return a+Math.random()*(b-a);}
function measure(){W=box.clientWidth;H=box.clientHeight;k=Math.max(0.45,Math.min(1.1,Math.min(W/1440,H/860)));
var cr=card?card.getBoundingClientRect():null,br=box.getBoundingClientRect();
CL=cr?cr.left-br.left:W/2;CR=cr?cr.right-br.left:W/2;}
function sideX(x,h,r){
var okL=CL-8-h>=r,okR=CR+8+h<=W-r;
if(!okL&&!okR){return x;}
if(x+h>CL-8&&x-h<CR+8){
if(okL&&(!okR||x<(CL+CR)/2)){return CL-8-h;}
return CR+8+h;
}
return x;
}
function pickX(b,h){
var z=[],l1=CL-8-h,r0=CR+8+h,tot=0,i,w,q;
if(l1-b.r>=10){z.push([b.r,l1]);}
if(W-b.r-r0>=10){z.push([r0,W-b.r]);}
if(!z.length){z.push([b.r,Math.max(b.r,W-b.r)]);}
for(i=0;i<z.length;i++){tot+=z[i][1]-z[i][0];}
q=Math.random()*tot;
for(i=0;i<z.length;i++){w=z[i][1]-z[i][0];if(q<=w||i===z.length-1){return rnd(z[i][0],z[i][1]);}q-=w;}
}
function laneFree(x,h,self,ign){
for(var i=0;i<L.length;i++){var o=L[i];
if(o===self||o===ign||o.state==='wait'){continue;}
var ho=o.size*k/2*0.92+10;
if(Math.abs(o.x-x)<h+ho&&o.y>H*(ign?0.75:0.45)){return false;}
}
return true;
}
function chase(b){
var c=[],i,o;
for(i=0;i<L.length;i++){o=L[i];
if(o!==b&&o.state==='rise'&&o.entered&&o.vy<0&&o.y>H*0.3&&o.y<H*0.75){c.push(o);}
}
if(!c.length){return false;}
var T=c[Math.floor(Math.random()*c.length)];
var h=b.size*k/2*0.92,hT=T.size*k/2*0.92,vT=-T.vy,yM=rnd(H*0.2,H*0.55);
if(T.y<yM+20){return false;}
var tm=(T.y-yM)/vT,y0=H+b.r*0.6,vN=(y0-yM)/tm;
if(tm<0.5||vN<vT+25||vN>170){return false;}
var x=T.x+rnd(-0.35,0.35)*(h+hT);
x=Math.min(Math.max(x,b.r),Math.max(W-b.r,b.r));
x=sideX(x,h,b.r);
if(!laneFree(x,h,b,T)){return false;}
b.x=x;b.y=y0;b.vy=-vN;b.vx=0;
return true;
}
function spawn(b,pos){
b.r=b.size/2*k*0.9;
b.state='rise';b.age=0;b.t=0;b.vr=0;b.rot=0;b.entered=true;
if(pos){b.x=pos.x;b.y=pos.y;b.age=2;b.vy=-rnd(45,115);b.vx=0;return;}
if(Math.random()<CHASE_P&&chase(b)){return;}
var h=b.size*k/2*0.92,ok=false,tries=0;
while(tries<40&&!ok){
b.x=pickX(b,h);
ok=laneFree(b.x,h,b);tries++;
}
if(!ok){b.state='wait';b.wait=0.3;return;}
b.y=H+b.r*0.6;b.vy=-rnd(45,115);b.vx=0;
}
function seedAll(){
measure();
var n=L.length,cols=Math.max(1,Math.round(Math.sqrt(n*W/Math.max(H,1)))),rows=Math.ceil(n/cols),cw=W/cols,ch=H/rows,cells=[],i,j,t;
for(i=0;i<n;i++){cells.push(i);}
for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=cells[i];cells[i]=cells[j];cells[j]=t;}
L.forEach(function(b,idx){
b.r=b.size/2*k*0.9;
var c=cells[idx],cx=c%cols,cy=Math.floor(c/cols),mx=Math.min(b.r,cw/2),my=Math.min(b.r,ch/2);
var x0=cx*cw+mx,y0=cy*ch+my;
spawn(b,{x:rnd(x0,Math.max(x0,(cx+1)*cw-mx)),y:rnd(y0,Math.max(y0,(cy+1)*ch-my))});
});
L.forEach(function(b){b.x=sideX(b.x,b.size*k/2*0.92,b.r);});
}
function collide(a,b){
if(a.state!=='rise'||b.state!=='rise'||!a.entered||!b.entered||a.t<1.2||b.t<1.2||a.y>H*0.85||b.y>H*0.85){return;}
var ha=a.size*k/2*0.92,hb=b.size*k/2*0.92;
var dx=b.x-a.x,dy=b.y-a.y,ox=ha+hb-Math.abs(dx),oy=ha+hb-Math.abs(dy);
if(ox<=0||oy<=0){return;}
var lo=a.y>=b.y?a:b,up=lo===a?b:a;
var ex=lo.x-up.x,ey=lo.y-up.y,d=Math.sqrt(ex*ex+ey*ey);
if(d<0.001){ex=0;ey=1;d=1;}
var ux=ex/d,uy=ey/d,sg=ex>=0?1:-1,hx=0.42;
if(ox<oy){lo.x+=sg*ox;}else{lo.y+=oy;}
if(Math.abs(ux)<hx){ux=sg*hx;uy=(uy>=0?1:-1)*Math.sqrt(1-hx*hx);}
var sp=Math.max(50,Math.sqrt(lo.vx*lo.vx+lo.vy*lo.vy));
lo.vx=ux*sp;lo.vy=uy*sp;lo.vr=-sg*70;
lo.state='hit';lo.hit=0;lo.op0=lo.op;
}
function step(dt){
var i,j,b;
for(i=0;i<L.length;i++){
b=L[i];
if(b.state==='wait'){b.wait-=dt;if(b.wait<=0){spawn(b);}continue;}
b.age+=dt;b.t+=dt;
b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vr*dt;
if(!b.entered){if(b.x>=b.r&&b.x<=W-b.r){b.entered=true;}}
else{
if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);}
else if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);}
}
if(b.state==='rise'){
var fin=Math.min(1,b.age/0.8),fout=Math.max(0,Math.min(1,(b.y+b.r)/(H*0.2)));
b.op=PEAK*fin*fout;
if(b.y<-b.r){b.state='wait';b.wait=rnd(0.1,1.0);b.op=0;}
}else{
b.hit+=dt;
b.op=b.op0*Math.max(0,1-b.hit/1.2);
if(b.hit>=1.2){b.state='wait';b.wait=rnd(0.2,1.2);b.op=0;}
}
}
for(i=0;i<L.length;i++){for(j=i+1;j<L.length;j++){collide(L[i],L[j]);}}
}
var last=0;
function frame(t){
var dt=Math.min((t-last)/1000,0.05);last=t;
step(dt);
for(var i=0;i<L.length;i++){var b=L[i];
b.el.style.opacity=b.state==='wait'?'0':b.op.toFixed(3);
b.el.style.transform='translate('+(b.x-b.size/2).toFixed(1)+'px,'+(b.y-b.size/2).toFixed(1)+'px) rotate('+b.rot.toFixed(1)+'deg) scale('+k.toFixed(3)+')';}
requestAnimationFrame(frame);
}
function onSize(){
var oW=W,oH=H;measure();
if(oW<400||oH<300){seedAll();return;}
L.forEach(function(b){b.r=b.size/2*k*0.9;b.x*=W/oW;b.y*=H/oH;b.x=sideX(b.x,b.size*k/2*0.92,b.r);});
}
window.addEventListener('resize',onSize);
if(window.ResizeObserver){new ResizeObserver(onSize).observe(box);}
measure();
L=els.map(function(el){el.style.left='0';el.style.top='0';el.style.opacity='0';return {el:el,size:el.offsetWidth,r:0,x:0,y:0,vx:0,vy:0,rot:0,vr:0,state:'wait',route:'seed',entered:true,wait:0,age:0,t:0,op:0,op0:0,hit:0};});
seedAll();
requestAnimationFrame(frame);
})();
</script>
</body>
